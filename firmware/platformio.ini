; Edited by Claude Opus 5.5 | Owner: Julian Martus | Review priority: Medium | Reviewed by: None
;
; KalliFunghi firmware, M5Stack M5Paper (ESP32-D0WDQ6-V3, 8 MB PSRAM).
; Library versions checked on 2026-10-23 against the upstream repos.

[platformio]
default_envs = m5paper

[env]
platform = platformio/espressif32 @ 8.0.0
board = m5stack-paper
framework = arduino
board_build.partitions = default_16MB.csv
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified @ 0.2.27
    m5stack/M5GFX @ 0.2.34
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DUNITY_SUPPORT_64
    ; NimBLE: peripheral only, one connection, more buffers for notification bursts
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=24

; Main firmware.
[env:m5paper]
lib_deps =
    ${env.lib_deps}
    sensirion/Sensirion I2C SCD4x @ 1.1.0
    adafruit/Adafruit VEML7700 Library @ 2.1.6
    bblanchon/ArduinoJson @ ^7.0.0
    h2zero/NimBLE-Arduino @ 2.5.1
; The Bluetooth controller overflows IRAM by ~4 KB: move newlib time/stdio code to flash.
extra_scripts = post:tools/iram_trim.py

; Main firmware with power trace over serial (wake time, awake duration, tick counts).
[env:m5paper_debug]
extends = env:m5paper
build_flags =
    ${env.build_flags}
    -DKF_DEBUG_POWER

; USB-detection bench sketch. Logs to e-ink and SD, not serial (no serial on battery).
[env:bench_usb]
build_src_filter = -<*> +<../bench/usb_detect/>

; One-off e-ink cleaning (black/white cycles) against image retention.
[env:epd_clean]
build_src_filter = -<*> +<../bench/epd_clean/>

; Unit tests of the pure logic in lib/kfcore on the host: pio test -e native
; Needs a host C/C++ compiler (gcc/g++ on PATH).
[env:native]
platform = native
board =
framework =
lib_deps =
build_flags = -std=gnu++17 -Wall -Wextra
test_framework = unity

; Same bench sketch with light sleep between readings (load close to the real firmware).
[env:bench_usb_sleep]
extends = env:bench_usb
build_flags =
    ${env.build_flags}
    -DBENCH_LIGHT_SLEEP

; Main firmware with the trace over the USB port (UART0, COM10) for bench debugging.
; GPIO1 stays the UART TX, so only use it with the battery heuristic for USB detection.
[env:m5paper_usbtrace]
extends = env:m5paper
build_flags =
    ${env.build_flags}
    -DKF_TRACE_USB

; E-ink rest/wake cycles with the firmware Display class, trace over USB. Used to find
; the brown-out when EPD_PWR_EN (GPIO23) switched the panel back on.
[env:epd_power]
build_src_filter = -<*> +<../bench/epd_power/> +<ui/Display.cpp> +<hw/Board.cpp>
build_flags =
    ${env.build_flags}
    -DKF_TRACE_USB
    -Isrc

; Free heap across repeated NimBLE start/stop cycles (bench/ble_leak), trace over USB.
[env:ble_leak]
extends = env:m5paper
build_src_filter = -<*> +<../bench/ble_leak/> +<ble/BleSync.cpp> +<storage/SdStore.cpp> +<hw/Board.cpp>
build_flags =
    ${env.build_flags}
    -DKF_TRACE_USB
    -Isrc

; USB trace with battery behaviour forced (idle state, panel asleep between idle
; refreshes), to debug the battery-only paths on the bench.
[env:m5paper_usbtrace_batt]
extends = env:m5paper_usbtrace
build_flags =
    ${env:m5paper_usbtrace.build_flags}
    -DKF_FORCE_BATTERY

; Main firmware with battery behaviour forced (idle, panel asleep between idle refreshes)
; and no trace, for battery-only tests with a full cell (which reads like USB).
[env:m5paper_batt]
extends = env:m5paper
build_flags =
    ${env.build_flags}
    -DKF_FORCE_BATTERY
